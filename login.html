<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Estante Virtual</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen font-sans text-slate-800">

    <!-- Card Principal -->
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
        
        <!-- Cabeçalho -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-600 mb-2">Estante Virtual</h1>
            <p class="text-sm text-slate-500">Sua biblioteca pessoal, sempre com você.</p>
        </div>

        <!-- Abas de Navegação -->
        <div class="flex mb-6 bg-slate-100 p-1 rounded-lg">
            <button id="btn-login" onclick="trocarAba('login')" class="flex-1 py-2 text-sm font-medium rounded-md bg-white shadow text-indigo-600 transition-all">Entrar</button>
            <button id="btn-cadastro" onclick="trocarAba('cadastro')" class="flex-1 py-2 text-sm font-medium rounded-md text-slate-500 hover:text-slate-700 transition-all">Criar Conta</button>
        </div>

        <!-- Formulário de Login -->
        <form id="form-login" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
                <input type="email" placeholder="seu@email.com" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
                <input type="password" placeholder="••••••••" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition-colors mt-2">Entrar na Estante</button>
        </form>

        <!-- Formulário de Cadastro (Oculto por padrão) -->
        <form id="form-cadastro" class="space-y-4 hidden">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nome Completo</label>
                <input type="text" placeholder="Ex: Ana Lima" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
                <input type="email" placeholder="seu@email.com" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
                <input type="password" placeholder="Crie uma senha forte" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition-colors mt-2">Criar Minha Conta</button>
        </form>
        
    </div>

    <!-- Script Simples para trocar as abas -->
    <script>
        function trocarAba(aba) {
            const formLogin = document.getElementById('form-login');
            const formCadastro = document.getElementById('form-cadastro');
            const btnLogin = document.getElementById('btn-login');
            const btnCadastro = document.getElementById('btn-cadastro');

            if (aba === 'login') {
                formLogin.classList.remove('hidden');
                formCadastro.classList.add('hidden');
                
                btnLogin.classList.add('bg-white', 'shadow', 'text-indigo-600');
                btnLogin.classList.remove('text-slate-500', 'hover:text-slate-700');
                
                btnCadastro.classList.remove('bg-white', 'shadow', 'text-indigo-600');
                btnCadastro.classList.add('text-slate-500', 'hover:text-slate-700');
            } else {
                formCadastro.classList.remove('hidden');
                formLogin.classList.add('hidden');
                
                btnCadastro.classList.add('bg-white', 'shadow', 'text-indigo-600');
                btnCadastro.classList.remove('text-slate-500', 'hover:text-slate-700');
                
                btnLogin.classList.remove('bg-white', 'shadow', 'text-indigo-600');
                btnLogin.classList.add('text-slate-500', 'hover:text-slate-700');
            }
        }
    </script>
</body>
</html>
